<svg xmlns="http://www.w3.org/2000/svg" width="2050" height="2555" viewBox="0 -60 2050 2555" role="img" aria-labelledby="title desc">
  <title id="title">AI 基础概念地图</title>
  <desc id="desc">用连接关系说明 AI、机器学习、深度学习、大语言模型、模型、API、应用程序、产品入口、一次请求流程以及常见问题之间的关系。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .panel { fill: #ffffff; stroke: #d9dee8; stroke-width: 2.4; }
      .title { font: 800 48px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #111827; }
      .panel-title { font: 700 34px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #1f2a37; }
      .note { font: 500 20px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #5b6472; }
      .section { font: 700 20px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #394150; }
      .node { fill: #ffffff; stroke-width: 2.8; }
      .node-text { font: 700 25px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #1f2a37; }
      .node-sub { font: 500 18px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #5b6472; }
      .small { font: 600 19px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #394150; }
      .tiny { font: 500 17px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #667085; }
      .card-title { font: 700 22px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #1f2a37; }
      .card-note { font: 500 19px "Microsoft YaHei", "Noto Sans SC", Arial, sans-serif; fill: #667085; }
      .line { fill: none; stroke: #9aa6b2; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .line-soft { fill: none; stroke: #b7c0ce; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 8; }
      .pill { fill: #eef2f7; stroke: #d9dee8; stroke-width: 1.6; }
      .blue { stroke: #2f80ed; }
      .green { stroke: #12b76a; }
      .purple { stroke: #7f56d9; }
      .orange { stroke: #f79009; }
      .red { stroke: #f04438; }
      .blue-fill { fill: #eef4ff; stroke: #2f80ed; }
      .green-fill { fill: #ecfdf3; stroke: #12b76a; }
      .purple-fill { fill: #f4f0ff; stroke: #7f56d9; }
      .orange-fill { fill: #fff7ed; stroke: #f79009; }
      .red-fill { fill: #fef3f2; stroke: #f04438; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#9aa6b2"/>
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2f80ed"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#12b76a"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#f79009"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="-60" width="2050" height="2555"/>
  <text x="1100" y="72" text-anchor="middle" class="title">AI 基础概念地图</text>

  <!-- 1. AI capability map -->
  <rect x="70" y="155" width="1910" height="940" rx="24" class="panel"/>
  <text x="120" y="208" class="panel-title">1. AI 能力地图：技术方法、模型方向、应用领域分开看</text>
  <text x="120" y="246" class="note">读法：技术方法提供底层手段，模型方向形成可复用能力，应用领域用这些能力解决真实问题并反推迭代。</text>

  <rect x="120" y="620" width="190" height="90" rx="15" class="node blue"/>
  <text x="215" y="658" text-anchor="middle" class="node-text">AI</text>
  <text x="215" y="690" text-anchor="middle" class="node-sub">人工智能总称</text>

  <path d="M310 665 C395 665, 405 395, 500 395" class="line-soft" marker-end="url(#arrowBlue)"/>
  <path d="M310 665 H500" class="line" marker-end="url(#arrow)"/>
  <path d="M310 665 C395 665, 405 935, 500 935" class="line-soft" marker-end="url(#arrowGreen)"/>

  <rect x="500" y="285" width="980" height="220" rx="18" class="node blue"/>
  <text x="545" y="326" class="node-text">技术方法</text>
  <text x="545" y="370" class="small">Machine Learning：让模型从数据中学习规律</text>
  <text x="545" y="407" class="small">Deep Learning：机器学习中的神经网络方法</text>
  <text x="545" y="444" class="small">Foundation Models（大模型）：通常基于深度学习训练的大规模通用模型</text>
  <text x="545" y="481" class="tiny">注：这是常见路径，不代表所有机器学习都会走向大模型</text>

  <path d="M990 505 V555" class="line" marker-end="url(#arrow)"/>
  <text x="1028" y="535" class="tiny">支撑</text>

  <rect x="500" y="555" width="980" height="220" rx="18" class="node purple"/>
  <text x="545" y="596" class="node-text">模型方向</text>
  <text x="545" y="640" class="small">LLM：以语言理解与生成为核心的大模型方向</text>
  <text x="545" y="677" class="small">多模态模型：同时处理文字、图像、音频等信息</text>
  <text x="545" y="714" class="small">视觉与语音生成模型：面向图像、视频、语音等内容生成</text>
  <text x="545" y="751" class="tiny">注：这是模型能力方向，不是产品名称；LLM 也不是所有 AI 的终点</text>

  <path d="M990 775 V825" class="line" marker-end="url(#arrow)"/>
  <text x="1028" y="805" class="tiny">赋能</text>

  <rect x="500" y="825" width="980" height="220" rx="18" class="node green"/>
  <text x="545" y="866" class="node-text">应用领域</text>
  <text x="545" y="910" class="small">CV：图像 / 视频理解与处理</text>
  <text x="545" y="947" class="small">Speech：语音识别、合成与理解</text>
  <text x="545" y="984" class="small">Robotics：感知、规划、控制与执行</text>
  <text x="545" y="1021" class="tiny">注：应用领域会组合多种模型能力，不是单一算法分支</text>

  <path d="M1480 935 C1705 935, 1705 395, 1480 395" class="line-soft" marker-end="url(#arrowBlue)"/>
  <path d="M1480 935 C1605 935, 1605 665, 1480 665" class="line-soft" marker-end="url(#arrowGreen)"/>
  <text x="1575" y="620" class="small">应用需求和真实数据</text>
  <text x="1575" y="648" class="small">会反过来推动模型方向</text>
  <text x="1575" y="676" class="small">与技术方法继续迭代</text>

  <g transform="translate(0 510)">
  <!-- 2. Model to app chain -->
  <rect x="70" y="630" width="1910" height="745" rx="24" class="panel"/>
  <text x="120" y="683" class="panel-title">2. 模型能力如何被应用调用</text>
  <text x="120" y="721" class="note">重点：模型、产品、第三方应用不是同一层；API 很常见，但不是唯一调用方式。</text>

  <text x="120" y="780" class="section">三层主链路</text>
  <rect x="120" y="815" width="500" height="155" rx="17" class="node purple"/>
  <text x="370" y="856" text-anchor="middle" class="node-text">模型层</text>
  <text x="180" y="895" class="small">GPT-5.5 / Claude Opus / Gemini 2.5</text>
  <text x="180" y="927" class="small">Llama 4 / DeepSeek-R1 等</text>

  <path d="M620 892 H690" class="line" marker-end="url(#arrow)"/>
  <rect x="690" y="815" width="500" height="170" rx="17" class="node orange"/>
  <text x="940" y="856" text-anchor="middle" class="node-text">调用与运行方式</text>
  <text x="750" y="895" class="small">云端 API：服务商托管，程序远程调用</text>
  <text x="750" y="927" class="small">本地运行：Ollama / LM Studio</text>
  <text x="750" y="959" class="small">SDK / Python：在程序里直接接入</text>

  <path d="M1190 892 H1260" class="line" marker-end="url(#arrow)"/>
  <rect x="1260" y="790" width="610" height="195" rx="17" class="node blue"/>
  <text x="1565" y="830" text-anchor="middle" class="node-text">产品与应用层</text>
  <text x="1320" y="872" class="small">官方产品：ChatGPT / Claude App / Gemini App</text>
  <text x="1320" y="909" class="small">第三方应用：Cursor / Open WebUI / OpenClaw</text>
  <text x="1320" y="946" class="tiny">注：ChatGPT 是产品，不是模型；Cursor 是应用，不是模型</text>

  <rect x="120" y="1013" width="1800" height="250" rx="22" style="fill: none; stroke: #b7c0ce; stroke-width: 2.8; stroke-dasharray: 10 8;"/>
  <text x="160" y="1052" class="section">系统编排与扩展能力</text>
  <rect x="160" y="1080" width="360" height="110" rx="15" class="green-fill"/>
  <text x="220" y="1116" class="card-title">Workflow：预定义流程</text>
  <text x="220" y="1156" class="card-note">可包含条件、循环、重试</text>

  <rect x="590" y="1080" width="650" height="110" rx="15" class="green-fill"/>
  <text x="650" y="1116" class="card-title">Agent：规划 + 工具调用 + 记忆 + 反思 + 执行</text>
  <text x="650" y="1156" class="card-note">不是高级脚本，而是能根据结果继续决策的系统</text>

  <rect x="1310" y="1080" width="560" height="110" rx="15" class="green-fill"/>
  <text x="1370" y="1116" class="card-title">RAG：检索资料 + 拼上下文 + 调用模型</text>
  <text x="1370" y="1156" class="card-note">用于减少幻觉，补充私有或最新资料</text>

  <text x="160" y="1232" class="small">一句话：Workflow 是骨架，可以指挥 Agent 干活，也可以调用 RAG 查资料。</text>

  <rect x="120" y="1298" width="780" height="42" rx="21" class="orange-fill"/>
  <text x="150" y="1326" class="small">不能用：常见卡在额度、限速、排队、文件过大或服务繁忙</text>

  <rect x="980" y="1298" width="940" height="42" rx="21" class="red-fill"/>
  <text x="1010" y="1326" class="small">隐私：敏感信息进入 Prompt、上传文件或第三方应用前，应先脱敏</text>

  <!-- 3. One request -->
  <g transform="translate(0 145)">
  <rect x="70" y="1275" width="1910" height="495" rx="24" class="panel"/>
  <text x="120" y="1328" class="panel-title">3. 一次请求里发生什么</text>
  <text x="120" y="1366" class="note">你给任务和资料，模型在上下文窗口内处理，再输出答案；重要答案要验证，不能只看语气是否自信。</text>

  <text x="120" y="1420" class="section">请求流</text>
  <rect x="120" y="1450" width="220" height="92" rx="17" class="node blue"/>
  <text x="230" y="1488" text-anchor="middle" class="node-text">Prompt</text>
  <text x="230" y="1520" text-anchor="middle" class="node-sub">你给的任务指令</text>

  <path d="M340 1496 H410" class="line" marker-end="url(#arrow)"/>
  <rect x="410" y="1450" width="240" height="92" rx="17" class="node blue"/>
  <text x="530" y="1488" text-anchor="middle" class="node-text">Context</text>
  <text x="530" y="1520" text-anchor="middle" class="node-sub">当前请求中可见的信息</text>

  <path d="M650 1496 H720" class="line" marker-end="url(#arrow)"/>
  <rect x="720" y="1450" width="240" height="92" rx="17" class="node purple"/>
  <text x="840" y="1488" text-anchor="middle" class="node-text">Model</text>
  <text x="840" y="1520" text-anchor="middle" class="node-sub">根据输入生成结果</text>

  <path d="M960 1496 H1030" class="line" marker-end="url(#arrow)"/>
  <rect x="1030" y="1450" width="220" height="92" rx="17" class="node green"/>
  <text x="1140" y="1488" text-anchor="middle" class="node-text">Answer</text>
  <text x="1140" y="1520" text-anchor="middle" class="node-sub">文本 / 代码 / 图片等输出</text>

  <text x="1350" y="1420" class="section">输出后的风险与验证</text>
  <rect x="1350" y="1450" width="230" height="92" rx="17" class="red-fill"/>
  <text x="1465" y="1486" text-anchor="middle" class="small">Hallucination</text>
  <text x="1465" y="1518" text-anchor="middle" class="tiny">可能看似合理但错误</text>

  <path d="M1580 1496 H1650" class="line-soft" marker-end="url(#arrowGreen)"/>
  <rect x="1650" y="1450" width="235" height="92" rx="17" class="green-fill"/>
  <text x="1767" y="1486" text-anchor="middle" class="small">Verification</text>
  <text x="1767" y="1518" text-anchor="middle" class="tiny">查来源 / 跑测试 / 回看原文</text>

  <text x="120" y="1600" class="section">影响这次请求的关键术语</text>
  <rect x="120" y="1620" width="430" height="110" rx="17" class="blue-fill"/>
  <text x="150" y="1658" class="node-text">Context Window</text>
  <text x="150" y="1702" class="node-sub">一次请求中模型最多能看到多少信息</text>

  <rect x="580" y="1620" width="340" height="110" rx="17" class="blue-fill"/>
  <text x="610" y="1658" class="node-text">Token</text>
  <text x="610" y="1702" class="node-sub">模型分词后的基本计算单位</text>

  <rect x="950" y="1620" width="390" height="110" rx="17" class="purple-fill"/>
  <text x="980" y="1658" class="node-text">Temperature</text>
  <text x="980" y="1702" class="node-sub">控制回答的随机性与创造性</text>

  <rect x="1370" y="1620" width="530" height="110" rx="17" class="blue-fill"/>
  <text x="1400" y="1658" class="node-text">Memory</text>
  <text x="1400" y="1702" class="node-sub">产品 / 系统保存的信息，不是模型天然记住</text>
  </g>
  </g>
</svg>
